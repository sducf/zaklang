[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "zakc"
version = "0.1.0"
description = "Native Rust Zak compiler with Python bindings"
requires-python = ">=3.12"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
# Build only the PyO3 module; the zakc binary and tests stay Cargo-only.
features = ["python"]
bindings = "pyo3"

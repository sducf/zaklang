[package]
name = "zakc"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native Rust Zak compiler"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
clap = { version = "4", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display"] }
pest = "2"
pest_derive = "2"
pyo3 = { version = "0.30.1", optional = true }
rustpython-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacker = "0.1.25"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"

[[bin]]
name = "zakc"
path = "src/main.rs"

# Maximum portable optimization. panic stays "unwind": PyO3 converts Rust
# panics into Python exceptions, while "abort" would kill the host process.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

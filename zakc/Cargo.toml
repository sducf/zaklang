[package]
name = "zakc"
version = "0.1.0"
edition = "2024"
publish = false
description = "Uncommitted exploration of a native Rust Zak compiler"

[dependencies]
clap = { version = "4", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display"] }
pest = "2"
pest_derive = "2"
rustpython-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacker = "0.1.25"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"

[[bin]]
name = "zakc"
path = "src/main.rs"

# Tests for each area of the repository. Nothing here needs Docker, the GPU, a live database, or a secret.
#
# Run each job locally from the repository root, in a Python 3.12 virtual environment:
#   compiler:   pip install -r zakc/requirements-dev.txt
#               cargo test --manifest-path zakc/Cargo.toml
#               PYO3_BUILD_EXTENSION_MODULE=1 cargo build --manifest-path zakc/Cargo.toml --features python --lib
#               mkdir -p zakc/target/python && cp zakc/target/debug/libzakc.so zakc/target/python/zakc.so
#               PYTHONPATH="$PWD/zakc/target/python:$PWD" python -m pytest -c zakc/pytest.ini zakc/tests -m "not docker"
#   zakbench:   pip install ./zakc httpx
#               python -m unittest discover -s zakbench/tests -t .
#               for f in zakbench/tasks/*/task.json zakbench/tasks/*/hidden_tests.json; do python -m json.tool "$f" > /dev/null || exit 1; done
#               cargo run --release --manifest-path zakc/Cargo.toml -- --emit check zakbench/tasks
#               python -m py_compile zakbench/tasks/*/reference.py
#   sandbox:    pip install -r zakc/requirements-dev.txt
#               python -m pytest sandbox/tests
#   backend:    cd backend && pip install -r requirements.txt   (builds ../zakc, so it needs Rust)
#               cd backend && DATABASE_URL=sqlite:// python -m unittest discover -s tests
#   playground: cd playground && npm install --legacy-peer-deps && npm run lint && npm run build   (Node 20.19.3)

name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zakc/requirements-dev.txt
      - run: pip install -r zakc/requirements-dev.txt
      - name: Run the native zakc tests
        run: cargo test --manifest-path zakc/Cargo.toml
      - name: Build the zakc Python extension
        env:
          PYO3_PYTHON: python
          PYO3_BUILD_EXTENSION_MODULE: "1"
        run: |
          cargo build --manifest-path zakc/Cargo.toml --features python --lib
          mkdir -p zakc/target/python
          cp zakc/target/debug/libzakc.so zakc/target/python/zakc.so
      # The docker marker leaves out the conformance tests that run the real Docker sandbox.
      - name: Run the zakc Python tests
        run: PYTHONPATH="$PWD/zakc/target/python:$PWD" python -m pytest -c zakc/pytest.ini zakc/tests -m "not docker"

  zakbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zakc/pyproject.toml
      # Builds the zakc PyO3 extension with maturin; the runner image ships a Rust toolchain.
      - run: pip install ./zakc httpx
      - name: Run the ZakBench tests
        run: python -m unittest discover -s zakbench/tests -t .
      - name: Check that every task.json and hidden_tests.json parses
        run: |
          for file in zakbench/tasks/*/task.json zakbench/tasks/*/hidden_tests.json; do
            python -m json.tool "$file" > /dev/null || { echo "::error file=$file::$file is not valid JSON"; exit 1; }
          done
      - name: Check that every reference.zak compiles
        run: cargo run --release --manifest-path zakc/Cargo.toml -- --emit check zakbench/tasks
      - name: Check that every reference.py compiles
        run: python -m py_compile zakbench/tasks/*/reference.py

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zakc/requirements-dev.txt
      - run: pip install -r zakc/requirements-dev.txt
      # These tests replace Docker with mocks.
      - run: python -m pytest sandbox/tests

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # The tests make their own in-memory SQLite databases. The app only needs some DATABASE_URL to import.
      - run: python -m unittest discover -s tests
        env:
          DATABASE_URL: sqlite://

  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20.19.3"
      # npm install, not npm ci: package-lock.json is in .gitignore. Print the npm log if the install fails.
      # --legacy-peer-deps: on Node 20, npm crashes ("reading 'edgesOut'") while it resolves vitest through vite's
      # optional @vitejs/devtools peers. The playground does not use them, and the install has the same 255 packages.
      - run: npm install --no-audit --no-fund --legacy-peer-deps || { tail -n 80 ~/.npm/_logs/*-debug-0.log; exit 1; }
      - run: npm run lint
      - run: npm run build

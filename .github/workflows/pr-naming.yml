name: PR naming

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  naming:
    name: Branch and commit names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so that base..head contains every commit in the pull request.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test the validation script
        run: python3 -m unittest discover -s .github/scripts

      # Pass PR data through env, not ${{ }} in the script, so a branch name cannot inject shell code.
      - name: Check the branch name and commit messages
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_pr_naming.py "$BRANCH" "$BASE_SHA" "$HEAD_SHA"
